[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doctranslate-backend"
version = "0.1.0"
description = "FastAPI backend for contextual PDF translation"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.49.0",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.52",
  "alembic==1.19.1",
  "python-multipart==0.0.32",
  "pymupdf==1.28.2",
  "pdfplumber==0.11.10",
  "ocrmypdf==17.10.0",
  "pikepdf==10.12.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "ruff==0.16.3",
  "mypy==1.20.2",
  "fpdf2==2.8.7",
  "pytesseract==0.3.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "blocked: contract case blocked because the endpoint or provider is not implemented",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.alembic]
script_location = "alembic"
