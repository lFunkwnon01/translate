name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Check formatting and lint
        run: ruff check app tests

      - name: Type check
        run: mypy app

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run Alembic against temporary SQLite
        shell: bash
        run: |
          set -euo pipefail
          database_dir="$(mktemp -d)"
          trap 'rm -rf "$database_dir"' EXIT
          DATABASE_URL="sqlite:///$database_dir/ci.sqlite3" alembic upgrade head
