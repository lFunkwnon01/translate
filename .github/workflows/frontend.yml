name: Frontend CI

on:
  push:
    paths:
      - "src/**"
      - "frontend/**"
      - "*.json"
      - "*.ts"
      - "*.tsx"
      - "*.mjs"
      - "bun.lock"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "src/**"
      - "frontend/**"
      - "*.json"
      - "*.ts"
      - "*.tsx"
      - "*.mjs"
      - "bun.lock"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - "."
          - "frontend"
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: bun run lint

      - name: Build
        run: bun run build
